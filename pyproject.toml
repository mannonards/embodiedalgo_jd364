[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mannonards-embodiedalgo_jd364"
version = "0.1.0"
description = "按段落统计具身智能算法工程师·冷启动与模型加载时间相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mannonards" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mannonards.github.io"
Repository = "https://github.com/mannonards/embodiedalgo_jd364"
Issues = "https://github.com/mannonards/embodiedalgo_jd364/issues"

[project.scripts]
embodiedalgo_jd364 = "embodiedalgo_jd364:main"

[tool.setuptools]
py-modules = ["embodiedalgo_jd364"]
